<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Survivez face à Bolgrot sur un plateau isométrique, avec un assistant IA (AlphaZero) qui suggère le meilleur coup et peut jouer à votre place."
    />

    <!-- Open Graph (aperçu de lien : Discord, Facebook, LinkedIn, Slack…) -->
    <!-- og:image / twitter:image DOIVENT être des URLs ABSOLUES : X/Twitter
         (contrairement à Facebook) n'affiche aucune carte avec une URL relative. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://bolgrot.web.app/" />
    <meta property="og:title" content="Bolgrot" />
    <meta
      property="og:description"
      content="Jeu de survie isométrique au tour par tour, avec un assistant IA (AlphaZero) qui suggère le meilleur coup et peut jouer à votre place."
    />
    <meta property="og:image" content="https://bolgrot.web.app/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Le jeu Bolgrot : plateau isométrique avec joueur, boss et flammes." />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bolgrot" />
    <meta
      name="twitter:description"
      content="Jeu de survie isométrique au tour par tour, avec un assistant IA (AlphaZero) qui suggère le meilleur coup et peut jouer à votre place."
    />
    <meta name="twitter:image" content="https://bolgrot.web.app/og-image.png" />
    <meta name="twitter:image:alt" content="Le jeu Bolgrot : plateau isométrique avec joueur, boss et flammes." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Bolgrot</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
