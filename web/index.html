<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="canonical" href="https://bolgrot.web.app/" />
    <meta
      name="description"
      content="Survivez face à Bolgrot sur un plateau isométrique, avec un assistant IA (AlphaZero) qui suggère le meilleur coup et peut jouer à votre place."
    />

    <!-- Open Graph (aperçu de lien : Discord, Facebook, LinkedIn, Slack…) -->
    <!-- og:image / twitter:image DOIVENT être des URLs ABSOLUES : X/Twitter
         (contrairement à Facebook) n'affiche aucune carte avec une URL relative. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://bolgrot.web.app/" />
    <meta property="og:title" content="Bolgrot" />
    <meta
      property="og:description"
      content="Jeu de survie isométrique au tour par tour, avec un assistant IA (AlphaZero) qui suggère le meilleur coup et peut jouer à votre place."
    />
    <meta property="og:image" content="https://bolgrot.web.app/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Le jeu Bolgrot : plateau isométrique avec joueur, boss et flammes." />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bolgrot" />
    <meta
      name="twitter:description"
      content="Jeu de survie isométrique au tour par tour, avec un assistant IA (AlphaZero) qui suggère le meilleur coup et peut jouer à votre place."
    />
    <meta name="twitter:image" content="https://bolgrot.web.app/og-image.png" />
    <meta name="twitter:image:alt" content="Le jeu Bolgrot : plateau isométrique avec joueur, boss et flammes." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Bolgrot — jeu de survie isométrique tour par tour avec IA</title>

    <!-- Données structurées (rich results Google) : jeu vidéo jouable en ligne. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "VideoGame",
        "name": "Bolgrot",
        "url": "https://bolgrot.web.app/",
        "description": "Jeu de survie isométrique au tour par tour : téléportez-vous pour éteindre les flammes sans qu'aucune ne vous touche. Un assistant IA (AlphaZero) suggère le meilleur coup et peut jouer à votre place.",
        "image": "https://bolgrot.web.app/og-image.png",
        "inLanguage": "fr",
        "genre": ["Stratégie", "Réflexion", "Survie"],
        "applicationCategory": "Game",
        "gamePlatform": ["Web", "Windows", "Linux", "macOS"],
        "operatingSystem": "Web browser, Windows, Linux, macOS",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "EUR"
        }
      }
    </script>

    <!-- Analytics visiteurs : GoatCounter (sans cookies, pas de bandeau RGPD).
         Tableau de bord : https://bolgrot.goatcounter.com -->
    <script data-goatcounter="https://bolgrot.goatcounter.com/count"
            async src="//gc.zgo.at/count.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <h1>Bolgrot — jeu de survie isométrique tour par tour</h1>
      <p>
        Bolgrot est un jeu de survie au tour par tour sur un plateau
        isométrique : téléportez-vous pour éteindre les flammes sans qu'aucune
        ne vous touche. Un assistant IA (AlphaZero) suggère le meilleur coup et
        peut jouer la partie à votre place. Jouable directement dans le
        navigateur, ou téléchargeable pour Windows, Linux et macOS (IA
        embarquée pour un jeu hors-ligne).
      </p>
      <p>
        Ce jeu nécessite JavaScript. Le code source est disponible sur
        <a href="https://github.com/Tryllogy/Bolgrot-Solver">GitHub</a>.
      </p>
    </noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
